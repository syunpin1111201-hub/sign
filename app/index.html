<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我喜歡上班">
<meta name="theme-color" content="#b08560">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>我喜歡上班</title>
<style>
:root{--bg:#f8f2ea;--hd:#b08560;--ac:#8b5e34;--tx:#3b2a1a;--mu:#a08a74;--ln:#eadfce}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.scr{display:none;position:fixed;inset:0;bottom:calc(64px + env(safe-area-inset-bottom));overflow-y:auto}
.scr.on{display:block}
#login.on,#gone.on{bottom:0}
.hd{background:var(--hd);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px;position:relative}
.hd .s{font-size:12px;color:#f3e6d6}.hd h2{margin:4px 0 0;font-size:20px}
.rf{position:absolute;right:14px;bottom:14px;color:#fff;font-size:12px;background:#ffffff2e;border-radius:12px;padding:4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.t{background:#fff;border-radius:16px;padding:16px 14px;min-height:96px;position:relative}
.t b{font-size:16px;display:block;margin-top:6px}.t small{color:var(--mu);font-size:12px;display:block;margin-top:2px}.t .e{font-size:26px}
.t.dim{opacity:.55}
.badge{position:absolute;top:10px;right:10px;background:#d9534f;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.card{background:#fff;margin:0 16px 10px;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6}.card b{color:var(--ac);margin-right:8px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 0 calc(8px + env(safe-area-inset-bottom));font-size:11px;color:#b5a28e;z-index:5}
.nav div{text-align:center;flex:1;padding-top:2px}.nav div i{font-style:normal;font-size:20px;display:block}.nav .on{color:var(--ac);font-weight:700}
#sgf{position:fixed;inset:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;background:var(--bg);flex-direction:column;z-index:4}
#sgf .eh{background:var(--hd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:15px;font-weight:700}#sgf iframe{border:0;width:100%;flex:1}
.an{background:#fff;border-radius:14px;margin:10px 16px 0;padding:14px;font-size:15px;display:flex;align-items:center;gap:10px}.an b{flex:1}.an span{color:var(--ac)}
#exf{position:fixed;inset:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;background:var(--bg);flex-direction:column}
#exf .eh{background:var(--hd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:15px;font-weight:700}#exf .eh small{display:block;font-weight:400;font-size:12px;color:#f3e6d6}
#exf iframe{border:0;width:100%;flex:1}
.rec div{background:#fff;border-radius:10px;padding:10px 12px;margin:8px 16px 0;font-size:14px}
#fr{position:fixed;inset:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;background:var(--bg)}
#fr iframe{border:0;width:100%;height:100%}
#fr .msg{padding:60px 20px;text-align:center;color:var(--ac);line-height:1.8}
.bar{display:none;position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));background:#3b2a1a;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:9;text-align:center}
.box{padding:26px 22px}.box h3{margin:0 0 6px}.box p{color:#8a7560;font-size:13px;margin:0 0 18px;line-height:1.6}
select,input{width:100%;background:#fff;border:1px solid #e0d2bf;border-radius:10px;padding:12px;font-size:16px;margin-bottom:12px;color:var(--tx);-webkit-appearance:none;appearance:none}
.btn{background:var(--hd);color:#fff;text-align:center;border-radius:10px;padding:13px;font-size:16px;border:0;width:100%}
.btn:disabled{opacity:.5}
.err{color:#c0392b;font-size:14px;min-height:20px;margin-bottom:8px}
.soon{padding:70px 24px;text-align:center;color:var(--mu);line-height:1.9}
.soon i{font-style:normal;font-size:44px;display:block}
.row2{display:flex;gap:10px;margin:0 16px 10px}.row2 .card{margin:0;flex:1}.big{font-size:19px;font-weight:700;color:var(--tx);display:block}.row2 small{color:var(--mu);font-size:12px}
.say{display:block;margin:0 16px 10px;background:var(--ac);color:#fff;border-radius:14px;padding:12px;font-size:15px;text-align:center}
textarea{width:100%;height:150px;border:1px solid #e0d2bf;border-radius:10px;padding:10px;font-size:16px;font-family:inherit;color:var(--tx)}
.hist{margin-top:18px}.hist div{background:#fff;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:14px;line-height:1.5;white-space:pre-wrap}.hist small{color:var(--mu)}
.new{background:#d9534f;color:#fff;border-radius:8px;font-size:11px;padding:1px 6px;margin-left:6px}
.mchip{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0}.mchip span{flex:0 0 auto;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:6px 14px;font-size:14px}.mchip span.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.mtx{background:#fff;margin:12px 16px 20px;border-radius:14px;padding:16px;font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.hrk{display:flex;justify-content:space-between;align-items:center;padding:3px 0}.hrk span{color:var(--mu)}.hrk i{font-style:normal;font-size:12px;color:var(--ac);border:1px solid var(--ac);border-radius:10px;padding:1px 8px;margin-left:8px}
.td{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f1e8dc}.td:last-child{border:0}
.dt{flex:0 0 44px;text-align:center;font-weight:700;color:var(--ac);font-size:13px;background:#f6ece0;border-radius:8px;padding:4px 0}
.td .x{flex:1;font-size:14px}.tdx{font-size:13px;color:#7a6550;margin-top:4px;line-height:1.6}
.st{flex:0 0 auto;font-size:12px;border-radius:10px;padding:3px 9px;border:1px solid #e0d2bf;color:#a08a74}.st.ok{background:#e5f4e4;color:#2f6b12;border-color:#b8dca5}.st.due{background:#fdecea;color:#c0392b;border-color:#f3b8b2}.st.soon{background:#fff3cd;color:#8a6d00;border-color:#f0dc9a}
.chip{text-decoration:none;display:inline-block;margin:6px 6px 0 0;background:#fff;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:3px 10px;font-size:13px}
.chip.f{background:var(--ac);color:#fff}
.sec2{margin:14px 18px 6px;font-size:13px;color:#9a8068;font-weight:700}
.bar2{height:8px;background:#f1e8dc;border-radius:4px;overflow:hidden;margin:4px 0}.bar2 i{display:block;height:100%;background:var(--hd)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1e8dc;font-size:14px}.pl:last-child{border:0}
.out{font-size:12px;color:var(--mu);text-align:center;margin:18px 0 24px}.out span{text-decoration:underline}
</style>
</head>
<body>

<!-- 登入 -->
<div class="scr" id="login">
  <div class="hd"><div class="s">八曜和茶</div><h2>我喜歡上班</h2></div>
  <div class="box">
    <h3>第一次使用</h3>
    <p>選門市、名字，輸入生日確認是本人<br>之後這支手機會記住，不用再輸入</p>
    <select id="ls"><option value="">選門市</option><option value="rh">熱河</option><option value="fs">鳳山中山</option></select>
    <select id="ln" disabled><option value="">先選門市</option></select>
    <input id="lb" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="生日 4 碼（例：3 月 15 日 → 0315）">
    <div class="err" id="le"></div>
    <button class="btn" id="lgo">開始使用</button>
  </div>
</div>

<!-- 首頁 -->
<div class="scr" id="home">
  <div class="hd"><div class="s" id="hs"></div><h2 id="hn"></h2><span class="rf" id="rf">↻ 更新</span><span class="rf" id="sw" style="display:none;right:90px"></span></div>
  <div class="card" id="ldc" style="display:none;margin-top:14px"></div>
  <div id="btd" style="display:none"><div class="sec2" id="btdh"></div><div class="card" id="btdl"></div></div>
  <div class="grid">
    <div class="t" onclick="go('lv')"><span class="badge" id="b1" style="display:none">1</span><span class="e">📅</span><b>劃假</b><small id="c1">　</small></div>
    <div class="t" onclick="go('sc')"><span class="e">🗓️</span><b>我的班表</b><small id="c2">　</small></div>
    <div class="t" onclick="go('ex')"><span class="badge" id="b3" style="display:none">!</span><span class="e">📝</span><b>考試</b><small id="c3">沒有考試</small></div>
    <div class="t" onclick="go('sg')"><span class="badge" id="b4" style="display:none"></span><span class="e">✍️</span><b>公告簽名</b><small id="c4">沒有要簽的</small></div>
  </div>
  <div class="card"><b>今天</b><span id="td">　</span></div>
  <div class="card" id="rmc" style="display:none"><b>提醒</b><span id="rm"></span></div>
  <div class="card" id="mtc" onclick="go('mt')" style="display:none"><b>📋 開會內容</b><span id="mtt"></span><span style="float:right;color:var(--mu)">›</span></div>
  <div class="card" id="hrc" style="display:none"></div>
  <div class="row2" id="mny" style="display:none"></div>
  <div class="say" id="sayb" onclick="go('say')">💬 對可樂說</div>
  <div class="out">不是你？<span onclick="logout()">登出</span></div>
</div>

<div class="scr" id="kh"><div class="hd"><div class="s" id="khs"></div><h2>📊 考核</h2></div><div id="khb"></div><div style="height:20px"></div></div>
<div class="scr" id="mt"><div class="hd"><div class="s" id="mts"></div><h2>📋 開會內容</h2></div><div id="mtb"></div></div>
<div class="scr" id="say">
  <div class="hd"><div class="s">只有可樂看得到</div><h2>💬 對可樂說</h2></div>
  <div class="box">
    <p>想法、建議、不方便當面講的都可以寫，會直接傳到可樂的 LINE（會顯示你的名字）</p>
    <textarea id="sayt" maxlength="1000" placeholder="想對可樂說的話…"></textarea>
    <div class="err" id="saye"></div>
    <button class="btn" id="sayg">送出</button>
    <div class="hist" id="sayh"></div>
  </div>
</div>
<div class="scr" id="ex"><div class="soon" id="exm"></div><div class="rec" id="exr"></div></div>
<div id="exf"><div class="eh" id="exh"></div></div>
<div class="scr" id="sg"><div class="hd"><div class="s">簽完會自動更新</div><h2>✍️ 公告簽名</h2></div><div id="sgl"></div></div>
<div id="sgf"><div class="eh"><span onclick="sgClose()" style="cursor:pointer">‹ 返回</span>　<span id="sgt"></span></div></div>

<!-- 已離職 -->
<div class="scr" id="gone"><div class="soon"><i>🔒</i><span id="gm">已無使用權限</span><br><br><button class="btn" style="width:auto;padding:10px 24px" onclick="logout()">回登入畫面</button></div></div>

<!-- 劃假／班表（沿用現有頁面） -->
<div id="fr"><div class="msg" id="frm">📅 載入中…</div></div>

<div class="bar" id="bar"></div>

<div class="nav" id="nav">
  <div data-v="home"><i>🏠</i>首頁</div>
  <div data-v="lv"><i>📅</i>劃假</div>
  <div data-v="sc"><i>🗓️</i>班表</div>
  <div data-v="ex"><i>📝</i>考試</div>
  <div data-v="sg"><i>✍️</i>簽名</div>
</div>

<script>
var EXEC = 'https://script.google.com/macros/s/AKfycbx4hEX0BHIQ__l06mgO5NrtOE1SkdVZ9Xru5Ps2buciWW4KhjVAFShpUdlKhBWRPkd5/exec';
var WK = '日一二三四五六';
function $(i) { return document.getElementById(i); }
function LS(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function api(q) {
  return fetch(EXEC + '?api=app&' + q).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function retry(fn, n) { return fn().catch(function (e) { if (n > 0) return new Promise(function (r) { setTimeout(r, 1200); }).then(function () { return retry(fn, n - 1); }); throw e; }); }
function bar(t, ms, fn) { var b = $('bar'); b.textContent = t; b.style.display = 'block'; b.onclick = fn || null; clearTimeout(bar.t); if (ms) bar.t = setTimeout(function () { b.style.display = 'none'; }, ms); }
function BOSS() { return U.n === '可樂'; }
function md(s) { var p = s.split('/'); return +p[1] + '/' + +p[2]; }
function wk(s) { var p = s.split('/'); return WK[new Date(+p[0], p[1] - 1, +p[2]).getDay()]; }

var U = { s: LS('app_s'), n: LS('app_n'), tok: LS('app_tok') }, DATA = null, CUR = 'home', FRV = '', FRH = '', LAST = 0;

// ---------- 登入 ----------
$('ls').onchange = function () {
  var s = this.value, n = $('ln');
  n.disabled = true; n.innerHTML = '<option value="">' + (s ? '名單載入中…' : '先選門市') + '</option>';
  if (!s) return;
  retry(function () { return api('op=staff&s=' + s); }, 2).then(function (j) {
    if ($('ls').value !== s) return;
    n.innerHTML = '<option value="">選你的名字</option>' + j.staff.map(function (x) { return '<option>' + x + '</option>'; }).join('');
    n.disabled = false;
  }).catch(function () { n.innerHTML = '<option value="">網路不穩，請重選門市</option>'; });
};
$('lgo').onclick = function () {
  var s = $('ls').value, n = $('ln').value, b = $('lb').value.replace(/\D/g, '');
  if (!s || !n) { $('le').textContent = '請選門市和名字'; return; }
  if (b.length !== 4) { $('le').textContent = '生日請輸入 4 碼，例：0315'; return; }
  $('le').textContent = ''; this.disabled = true; this.textContent = '確認中…';
  var me = this;
  retry(function () { return api('op=login&s=' + s + '&n=' + encodeURIComponent(n) + '&b=' + b); }, 1).then(function (j) {
    me.disabled = false; me.textContent = '開始使用';
    if (!j.ok) { $('le').textContent = j.err; return; }
    U = { s: s, n: n, tok: j.tok }; LS('app_s', s); LS('app_n', n); LS('app_tok', j.tok);
    start();
  }).catch(function () { me.disabled = false; me.textContent = '開始使用'; $('le').textContent = '網路不穩，請再按一次'; });
};
function logout() { ['app_s', 'app_n', 'app_tok', 'app_cache'].forEach(function (k) { LS(k, null); }); if (U.s) LS('lvMe' + U.s, null); U = {}; DATA = null; FRH = ''; show('login'); }

// ---------- 畫面切換 ----------
function show(v) {
  CUR = v;
  ['login', 'home', 'say', 'mt', 'kh', 'ex', 'sg', 'gone'].forEach(function (x) { $(x).classList.toggle('on', x === v); });
  if (v !== 'sg') $('sgf').style.display = 'none';
  if (v === 'ex' && EXA()) { $('ex').classList.remove('on'); $('exf').style.display = 'flex'; exFrame(); } else $('exf').style.display = 'none';
  if (CUR0 === 'ex' && v !== 'ex' && EXA()) { LAST = 0; load(1); }   // 離開考試頁 → 看是不是交卷了
  CUR0 = v;
  $('fr').style.display = (v === 'lv' || v === 'sc') ? 'block' : 'none';
  $('nav').style.display = (v === 'login' || v === 'gone') ? 'none' : 'flex';
  [].forEach.call(document.querySelectorAll('.nav div'), function (d) { d.classList.toggle('on', d.getAttribute('data-v') === (v === 'say' || v === 'mt' ? 'home' : v)); });
  if (v === 'lv' || v === 'sc') frame();
  if (v === 'home') { load(0); if (DATA) mtRender(); }
  if (v === 'mt') { MTI = 0; mtRender(); window.scrollTo(0, 0); }
}
function go(v) { show(v); }
// ---------- 考試（幹部開考才有，30 分鐘內要開始；考試中離開 App 會通知幹部群） ----------
var CUR0 = '', EXT = '';
function EXA() { var c = DATA && DATA.exam && DATA.exam.cur; return c && c.t ? c : null; }
function exRender() {
  var x = (DATA && DATA.exam) || {}, c = x.cur, rec = x.rec || [];
  $('b3').style.display = c && c.t ? '' : 'none';
  $('c3').textContent = c && c.t ? (c.st === '作答中' ? c.title + ' 作答中' : c.title + '・' + c.left + ' 分內開始') : c && c.expired ? '已過期，找幹部重開' : rec.length ? '最近：' + rec[0].type + (rec[0].ok ? ' ✅' : ' ❌') : '沒有考試';
  $('exm').innerHTML = c && c.expired ? '<i>⌛</i>' + c.title + '超過 30 分鐘沒開始<br>請找幹部重新開考' : '<i>📝</i>目前沒有考試<br>到店後請幹部幫你開考';
  $('exr').innerHTML = rec.length ? '<div style="background:none;padding:0 0 0 2px;color:var(--mu)">最近考試</div>' + rec.map(function (r) { return '<div>' + (r.ok ? '✅' : '❌') + ' ' + r.d + '　' + r.type + '考試　' + r.sc + ' 分</div>'; }).join('') : '';
  if (CUR === 'ex') show('ex');
}
function exFrame() {
  var c = EXA(); if (!c) return;
  $('exh').innerHTML = '📝 ' + c.title + '<small>考試中離開 App（切到 LINE、相簿等）會通知幹部</small>';
  if (EXT === c.t && $('exf').querySelector('iframe')) return;
  var o = $('exf').querySelector('iframe'); if (o) o.remove();
  var f = document.createElement('iframe'); f.src = c.url; $('exf').appendChild(f); EXT = c.t;
}
document.addEventListener('visibilitychange', function () {
  var c = EXA(); if (!c || CUR !== 'ex' || EXT !== c.t) return;
  var k = 'exlv_' + c.t;
  if (document.hidden) {
    var n = (Number(LS(k)) || 0) + 1; LS(k, n);
    try { fetch(EXEC + '?api=app&op=exlv&s=' + U.s + '&n=' + encodeURIComponent(U.n) + '&tok=' + U.tok + '&t=' + c.t + '&c=' + n, { keepalive: true }).catch(function () { }); } catch (e) { }
  } else bar('⚠️ 考試中離開 App 已通知幹部（第 ' + (LS(k) || 1) + ' 次）', 4000);
});
[].forEach.call(document.querySelectorAll('.nav div'), function (d) { d.onclick = function () { go(d.getAttribute('data-v')); }; });

// ---------- 首頁 ----------
function render() {
  var d = DATA; if (!d) return;
  $('hs').textContent = d.store + '｜' + d.me.sh + d.me.cls;
  $('sw').style.display = BOSS() ? '' : 'none'; $('sw').textContent = '換' + (U.s === 'rh' ? '鳳山中山' : '熱河'); $('hn').textContent = d.me.n + ' 你好';
  var h = d.home || {}, p = h.per;
  if (p) {
    $('c1').textContent = h.mine ? '已劃 ' + h.mine + ' 天・' + md(p.dl) + ' 截止' : md(p.dl) + ' 截止，還沒劃';
    $('b1').style.display = h.mine || BOSS() ? 'none' : '';
    if (BOSS()) $('c1').textContent = '看全部人・' + md(p.dl) + ' 截止';
    $('rm').textContent = md(p.s) + '–' + md(p.e) + ' 劃假 ' + md(p.dl) + '（' + wk(p.dl) + '）截止' + (p.left <= 3 ? '，剩 ' + p.left + ' 天' : '');
    $('rmc').style.display = '';
  } else { $('c1').textContent = '目前沒有開放'; $('b1').style.display = 'none'; $('rmc').style.display = 'none'; }
  $('c2').textContent = h.tomorrow ? '明天 ' + h.tomorrow : '班表還沒發布';
  $('td').textContent = h.today ? h.today : '班表還沒發布';
  var m = d.money || {}, mh = '';
  if (m.owe) mh += '<div class="card"><b>⏱ 尚欠時數</b><span class="big">' + m.owe + ' 小時</span></div>';
  if (m.loan) mh += '<div class="card"><b>💰 借支</b><span class="big">剩 ' + m.loan.bal.toLocaleString() + '</span><small>' + (m.loan.mon ? m.loan.m + ' 月扣 ' + m.loan.mon.toLocaleString() : m.loan.m + ' 月沒有要扣') + '</small></div>';
  $('mny').innerHTML = mh; $('mny').style.display = mh ? '' : 'none';
  $('sayb').style.display = BOSS() || !d.says ? 'none' : '';   // 機器人還沒更新前先藏起來
  hist(d.says);
  exRender();
  sgRender();
  mtRender();
  bossRender();
  leadRender();
  var hr = d.hr;
  $('hrc').style.display = hr ? '' : 'none';
  if (hr) $('hrc').innerHTML = '<b>🔑 風行人資系統</b><div class="hrk"><span>網域</span><b>' + hr.dom + '<i onclick="cp(\'' + hr.dom + '\')">複製</i></b></div><div class="hrk"><span>帳號</span><b>' + esc(hr.id) + '<i onclick="cp(\'' + esc(hr.id) + '\')">複製</i></b></div><div class="hrk"><span>預設密碼</span><b>' + hr.pw + '</b></div>';
}
// ---------- 可樂：每月待辦＋考核進度 ----------
function bossRender() {
  var B = DATA && DATA.boss, nv = document.querySelector('.nav div[data-v=ex]') || document.querySelector('.nav div[data-v=kh]');
  if (nv) { nv.setAttribute('data-v', B ? 'kh' : 'ex'); nv.innerHTML = B ? '<i>📊</i>考核' : '<i>📝</i>考試'; }
  $('btd').style.display = B ? '' : 'none';
  if (!B) return;
  var now = new Date(), dn = now.getDate(), last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  $('btdh').textContent = '這個月要做的（' + (now.getMonth() + 1) + ' 月）';
  $('btdl').innerHTML = (B.todo || []).map(function (t, i) {
    var dd = (t.d === 99 ? last : t.d) - dn, c, lab;
    if (t.done) { c = 'ok'; lab = '✓ 完成'; } else if (dd < 0) { c = 'due'; lab = '過期'; } else if (dd === 0) { c = 'due'; lab = '今天'; } else if (dd <= 3) { c = 'soon'; lab = '剩 ' + dd + ' 天'; } else { c = ''; lab = '打勾'; }
    var open = !t.done && dd <= 3;
    return '<div class="td"><span class="dt">' + esc(t.dl) + '</span><span class="x" onclick="var e=$(\'tdx' + i + '\');e.style.display=e.style.display?\'\':\'none\'"><b style="color:var(--tx);margin:0">' + esc(t.t) + '</b>' +
      '<div class="tdx" id="tdx' + i + '" style="' + (open ? '' : 'display:none') + '">' + esc(t.x) + '<br>' +
      t.cmd.map(function (c2) { return '<span class="chip" onclick="event.stopPropagation();cp(\'' + esc(c2) + '\')">' + esc(c2) + ' 複製</span>'; }).join('') +
      (t.btn === 'kh' ? '<span class="chip f" onclick="event.stopPropagation();go(\'kh\')">開考核頁 ›</span>' : '') + '</div></span>' +
      '<span class="st ' + c + '" onclick="tdDone(' + i + ')">' + lab + '</span></div>';
  }).join('') || '<div style="color:var(--mu)">還沒有待辦（老闆管理中心「46_可樂每月待辦」可以加）</div>';
  khRender();
}
function tdDone(i) {
  var t = DATA.boss.todo[i]; if (!t) return;
  t.done = !t.done; bossRender();
  api('op=btodo&s=' + U.s + '&n=' + encodeURIComponent(U.n) + '&tok=' + U.tok + '&r=' + t.r + '&v=' + (t.done ? 1 : 0)).then(function (j) {
    if (j.ok && j.todo) { DATA.boss.todo = j.todo; LS('app_cache', JSON.stringify(DATA)); bossRender(); } else { t.done = !t.done; bossRender(); bar(j.err || '沒存到，請再按一次', 2500); }
  }).catch(function () { t.done = !t.done; bossRender(); bar('網路不穩，請再按一次', 2500); });
}
function khRender() {
  var B = DATA && DATA.boss; if (!B) return;
  $('khs').textContent = '考核期 ' + B.period + '（' + B.m + ' 期）';
  var h = '<div class="sec2">員工考核（幹部打）</div><div class="card">';
  (B.kh || []).forEach(function (k) {
    var done = k.total - k.left.length, sn = k.s === '熱河' ? '熱河' : '鳳山';
    h += '<div style="margin-top:6px;display:flex;justify-content:space-between"><b style="color:var(--tx)">' + sn + '</b><span>' + done + '／' + k.total + ' 人</span></div><div class="bar2"><i style="width:' + (k.total ? Math.round(done / k.total * 100) : 0) + '%"></i></div>' +
      (k.left.length ? '<div style="font-size:13px;color:var(--mu)">還沒打完：' + k.left.map(esc).join('、') + '</div>' : '<div style="font-size:13px;color:#2f6b12">✅ 都打完了</div>') +
      '<a class="chip f" href="' + k.boss + '" target="_blank">' + sn + '審核頁 ›</a>' + (k.left.length ? '<span class="chip" onclick="remind(\'' + (k.s === '熱河' ? 'rh' : 'fs') + '\',' + k.left.length + ')">📣 提醒' + sn + '幹部</span>' : '') + '<div style="height:8px"></div>';
  });
  h += '</div><div class="sec2">我要打的</div><div class="card">';
  var cd = (B.cad || []).filter(function (x) { return x.st !== '未打' && x.st !== '草稿'; }).length;
  h += '<b style="color:var(--tx)">幹部考核</b>　<span class="st ' + (cd === (B.cad || []).length && cd ? 'ok' : 'soon') + '">' + cd + '／' + (B.cad || []).length + '</span>' +
    ((B.cad || []).length ? (B.cad || []).map(function (x) { return '<div class="pl"><span>' + esc(x.n) + ' <small style="color:var(--mu)">' + esc(x.s) + (x.t !== '幹部' ? '・' + esc(x.t) : '') + '・' + esc(x.st) + '</small></span><span><a class="chip f" href="' + x.url + '" target="_blank">打分</a><a class="chip" href="' + x.talk + '" target="_blank">面談</a></span></div>'; }).join('')
      : '<div style="font-size:13px;color:var(--mu);margin-top:6px">這期連結還沒產生：老闆機器人打一次 #幹部考核 就會出現</div>');
  var rd = (B.rsv || []).filter(function (x) { return x.st !== '未打' && x.st !== '草稿'; }).length;
  h += '<div style="height:10px"></div><b style="color:var(--tx)">儲備考核</b>　<span class="st ' + (rd === (B.rsv || []).length ? 'ok' : 'soon') + '">' + rd + '／' + (B.rsv || []).length + '</span>' +
    (B.rsv || []).map(function (x) { return '<div class="pl"><span>' + esc(x.n) + ' <small style="color:var(--mu)">' + esc(x.st) + '</small></span><span><a class="chip f" href="' + x.url + '" target="_blank">打分</a><a class="chip" href="' + x.talk + '" target="_blank">面談</a></span></div>'; }).join('') + '</div>';
  var tk = [], tn = 0; (B.kh || []).forEach(function (k) { k.talk.forEach(function (t) { tk.push(t); if (t.ok) tn++; }); });
  h += '<div class="sec2">員工面談（25 號～5 號）已簽 ' + tn + '／' + tk.length + '</div><div class="card">' + tk.map(function (t) { return '<div class="pl"><span>' + (t.ok ? '✅ ' : '') + esc(t.n) + '</span><a class="chip" href="' + t.url + '" target="_blank">面談頁 ›</a></div>'; }).join('') + '</div>';
  $('khb').innerHTML = h;
}
function remind(s, n) {
  if (!confirm('推到' + (s === 'rh' ? '熱河' : '鳳山') + '幹部群，提醒還有 ' + n + ' 位考核沒打完？')) return;
  api('op=remind&s=' + s + '&n=' + encodeURIComponent(U.n) + '&tok=' + U.tok).then(function (j) { bar(j.msg || j.err || '已送出', 2500); }).catch(function () { bar('網路不穩，請再按一次', 2500); });
}
function cp(t) { try { navigator.clipboard.writeText(t).then(function () { bar('已複製 ' + t, 1500); }); } catch (e) { bar(t, 3000); } }
// ---------- 開會內容（可樂私訊機器人 #開會內容 放上來） ----------
var MTI = 0;
function ymTxt(ym) { var p = ym.split('/'); return +p[0] + ' 年 ' + +p[1] + ' 月'; }
function mtRender() {
  var L = (DATA && DATA.mtg) || [];
  $('mtc').style.display = L.length ? '' : 'none';
  if (!L.length) return;
  var seen = LS('mt_seen_' + U.s) || '';
  $('mtt').innerHTML = ymTxt(L[0].ym) + (seen < L[0].ym + L[0].at ? '<span class="new">新</span>' : '');
  if (MTI >= L.length) MTI = 0;
  $('mts').textContent = (DATA.store || '') + '｜' + L[MTI].at + ' 更新';
  $('mtb').innerHTML = '<div class="mchip">' + L.map(function (x, i) { return '<span class="' + (i === MTI ? 'on' : '') + '" onclick="MTI=' + i + ';mtRender()">' + ymTxt(x.ym).replace(/^\d+ 年 /, '') + '</span>'; }).join('') + '</div><div class="mtx">' + esc(L[MTI].x) + '</div>';
  if (CUR === 'mt' && MTI === 0) LS('mt_seen_' + U.s, L[0].ym + L[0].at);
}
// ---------- 公告簽名（沿用原本簽名頁，從 App 打開直接帶本人） ----------
function sgRender() {
  if (!DATA || !DATA.ann) { $('c4').textContent = '即將開放'; $('b4').style.display = 'none'; $('sgl').innerHTML = '<div class="soon" style="padding:50px 24px"><i>✍️</i>即將開放</div>'; return; }   // 機器人還沒更新
  if (DATA.ann.boss) {   // 可樂：每則公告還有誰沒簽
    var B = DATA.ann.list || [], left = B.reduce(function (n, x) { return n + x.todo.length; }, 0);
    $('b4').style.display = left ? '' : 'none'; $('b4').textContent = left;
    $('c4').textContent = B.length ? B.length + ' 則進行中・' + left + ' 人未簽' : '沒有進行中的公告';
    $('sgl').innerHTML = B.length ? B.map(function (x) {
      var g = {}; x.todo.forEach(function (p) { (g[p.s] = g[p.s] || []).push(p.n); });
      return '<div class="card" style="margin-top:10px"><b style="color:var(--tx)">' + esc(x.t) + '</b><br><span style="color:var(--mu);font-size:13px">' + x.type + '｜已簽 ' + x.done + '／' + x.total + '</span>' +
        (x.todo.length ? Object.keys(g).map(function (k) { return '<div style="margin-top:6px"><b>' + k + ' 未簽 ' + g[k].length + '</b>' + g[k].map(esc).join('、') + '</div>'; }).join('') : '<div style="margin-top:6px;color:#2f6b12">✅ 全部簽完</div>') + '</div>';
    }).join('') : '<div class="soon" style="padding:50px 24px"><i>✅</i>沒有進行中的公告</div>';
    return;
  }
  var a = (DATA && DATA.ann) || { todo: [], done: [] }, t = a.todo || [], dn = a.done || [];
  $('b4').style.display = t.length ? '' : 'none'; $('b4').textContent = t.length;
  $('c4').textContent = t.length ? t.length + ' 份還沒簽' : '都簽好了';
  $('sgl').innerHTML = (t.length ? t.map(function (x, i) { return '<div class="an" onclick="sgOpen(' + i + ')"><span>✍️</span><b>' + esc(x.t) + '</b><span>去簽 ›</span></div>'; }).join('') : '<div class="soon" style="padding:50px 24px"><i>✅</i>目前沒有要簽的公告</div>') +
    (dn.length ? '<div class="rec"><div style="background:none;padding:14px 0 0 2px;color:var(--mu)">簽過的</div>' + dn.map(function (x) { return '<div>✅ ' + esc(x.t) + (x.at ? '　<small style="color:var(--mu)">' + x.at + '</small>' : '') + '</div>'; }).join('') + '</div>' : '');
}
function sgOpen(i) {
  var x = DATA.ann.todo[i]; if (!x) return;
  $('sgt').textContent = x.t;
  var o = $('sgf').querySelector('iframe'); if (o) o.remove();
  var f = document.createElement('iframe'); f.src = x.url; $('sgf').appendChild(f); $('sgf').style.display = 'flex';
}
function ovOpen(t, u) {   // 在 App 裡開頁面（打考核、簽名…）
  $('sgt').innerHTML = esc(t) + ' <a href="' + u + '" target="_blank" style="color:#fff;font-weight:400;font-size:12px;margin-left:8px;text-decoration:underline">打不開點這裡</a>';
  var o = $('sgf').querySelector('iframe'); if (o) o.remove();
  var f = document.createElement('iframe'); f.src = u; $('sgf').appendChild(f); $('sgf').style.display = 'flex';
}
function leadRender() {
  var L = DATA && DATA.lead;
  $('ldc').style.display = L && !L.err ? '' : 'none';
  if (!L || L.err) return;
  var done = L.total - L.left.length;
  $('ldc').innerHTML = '<b>📝 打員工考核</b><span style="color:var(--mu);font-size:13px">' + L.period + '・' + L.dl + ' 前打完</span>' +
    '<div style="display:flex;justify-content:space-between;margin-top:6px"><span>' + (DATA.store || '') + '</span><span>' + done + '／' + L.total + ' 人</span></div><div class="bar2"><i style="width:' + (L.total ? Math.round(done / L.total * 100) : 0) + '%"></i></div>' +
    (L.left.length ? '<div style="font-size:13px;color:var(--mu)">還沒打完：' + L.left.map(esc).join('、') + '</div>' : '<div style="font-size:13px;color:#2f6b12">✅ 都打完了</div>') +
    '<span class="chip f" onclick="ovOpen(\'打員工考核\', DATA.lead.url)">開始打考核 ›</span>';
}
function sgClose() { $('sgf').style.display = 'none'; var o = $('sgf').querySelector('iframe'); if (o) o.remove(); LAST = 0; load(0); }   // 關掉就更新進度
window.addEventListener('message', function (e) { if (e.data && e.data.annSigned) { bar('簽好了 👍', 2000); setTimeout(function () { LAST = 0; load(0); }, 1500); } });
function esc(x) { return String(x).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function hist(a) { $('sayh').innerHTML = a && a.length ? '<b>之前說過的</b>' + a.map(function (x) { return '<div>' + esc(x.x) + '<br><small>' + x.t + ' 送出</small></div>'; }).join('') : ''; }
$('sayg').onclick = function () {
  var t = $('sayt').value.trim(), me = this;
  if (!t) { $('saye').textContent = '請先寫內容'; return; }
  $('saye').textContent = ''; me.disabled = true; me.textContent = '送出中…';
  api('op=say&s=' + U.s + '&n=' + encodeURIComponent(U.n) + '&tok=' + U.tok + '&t=' + encodeURIComponent(t)).then(function (j) {
    me.disabled = false; me.textContent = '送出';
    if (!j.ok) { $('saye').textContent = j.err; return; }
    $('sayt').value = ''; hist(j.says); if (DATA) { DATA.says = j.says; LS('app_cache', JSON.stringify(DATA)); } bar('已傳給可樂 👍', 2000);
  }).catch(function () { me.disabled = false; me.textContent = '送出'; $('saye').textContent = '網路不穩，請再按一次'; });
};

// ---------- 劃假／班表（沿用原本頁面，放在框框裡） ----------
function frame() {
  var f = $('fr'), ifr = f.querySelector('iframe');
  if (!DATA) { $('frm').style.display = 'block'; return; }
  var want = CUR === 'sc' ? 1 : 0;
  if (!ifr || FRV !== DATA.html) {
    if (ifr) ifr.remove();
    ifr = document.createElement('iframe'); FRV = DATA.html;
    ifr.onload = function () { tune(ifr); setMode(ifr, CUR === 'sc' ? 1 : 0); };
    LS('lvMe' + U.s, BOSS() ? '__view' : U.n);   // 可樂＝只看模式（看得到全部人）
    ifr.srcdoc = DATA.html; f.appendChild(ifr); $('frm').style.display = 'none';
  } else setMode(ifr, want);
}
function tune(ifr) {
  try {
    var st = ifr.contentDocument.createElement('style');
    st.textContent = '.me a{display:none!important}#mt{display:none!important}body{padding-bottom:20px}';
    ifr.contentDocument.head.appendChild(st);
  } catch (e) { }
}
function setMode(ifr, k) { try { ifr.contentWindow.mode(k); ifr.contentWindow.scrollTo(0, 0); } catch (e) { } }

// ---------- 抓資料：先顯示上次的，再背景更新 ----------
function load(force) {
  if (!U.tok) return;
  if (!force && Date.now() - LAST < 60000) return;
  LAST = Date.now();
  if (force) bar('更新中…');
  retry(function () { return api('op=all&s=' + U.s + '&n=' + encodeURIComponent(U.n) + '&tok=' + U.tok); }, 2).then(function (j) {
    if (!j.ok) {
      if (j.out) { ['app_tok', 'app_cache'].forEach(function (k) { LS(k, null); }); $('gm').innerHTML = j.err.replace('，', '<br>'); show('gone'); return; }
      bar(j.err, 4000); return;
    }
    var changed = !DATA || DATA.html !== j.html;
    DATA = j; LS('app_cache', JSON.stringify(j)); render();
    if (CUR === 'lv' || CUR === 'sc') {
      if (changed) bar('有新資料，點這裡更新', 0, function () { $('bar').style.display = 'none'; frame(); });
      else if (force) bar('已是最新', 1500);
    } else { if (force) bar('已更新', 1500); }
  }).catch(function () { bar(DATA ? '網路不穩，先顯示上次的資料' : '網路不穩，請稍後再試', 3000); if (!DATA) $('frm').innerHTML = '網路不穩，打不開<br><button class="btn" style="width:auto;padding:10px 22px" onclick="load(1)">重新整理</button>'; });
}
$('rf').onclick = function () { load(1); };
$('sw').onclick = function () {   // 可樂切換門市
  U.s = U.s === 'rh' ? 'fs' : 'rh'; LS('app_s', U.s); DATA = null; FRV = ''; var f = $('fr').querySelector('iframe'); if (f) f.remove();
  $('hs').textContent = '載入中…'; $('frm').style.display = 'block'; LAST = 0; load(1);
};
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(0); });

function start() {
  if (!U.tok) { show('login'); return; }
  try { DATA = JSON.parse(LS('app_cache') || 'null'); } catch (e) { DATA = null; }
  if (DATA && DATA.me && (DATA.me.n !== U.n || (DATA.s && DATA.s !== U.s))) DATA = null;
  if (DATA) render(); else { $('hs').textContent = '載入中…'; $('hn').textContent = U.n + ' 你好'; }
  show('home');
  LAST = 0; load(0);
}
start();
if ('serviceWorker' in navigator) {
  var hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { try { r.update(); } catch (e) { } }).catch(function () { });
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW && !window.__rl) { window.__rl = 1; location.reload(); } });   // App 有新版 → 自動換
}
</script>
</body>
